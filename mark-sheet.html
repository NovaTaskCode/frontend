<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark-Sheet Calculator</title>
</head>
<body>
    <h1 align="center">Mark-Sheet Calculator</h1>
    <form name="frm1">
        <table border="1" cellpadding="5px" cellspacing="0" width="50%" align="center">
            <tr>
                <td>Hindi</td>
                <td><input type="number" min="0" max="100" name="sub1"> (max : 100)</td>
            </tr>
            <tr>
                <td>English</td>
                <td><input type="number" min="0" max="100" name="sub2"> (max : 100)</td>
            </tr>
            <tr>
                <td>Maths</td>
                <td><input type="number" min="0" max="100" name="sub3"> (max : 100)</td>
            </tr>
            <tr>
                <td>Science</td>
                <td><input type="number" min="0" max="100" name="sub4"> (max : 100)</td>
            </tr>
            <tr>
                <td>Art</td>
                <td><input type="number" min="0" max="100" name="sub5"> (max : 100)</td>
            </tr>
            <tr>
                <td>Computer</td>
                <td><input type="number" min="0" max="100" name="sub6"> (max : 100)</td>
            </tr>
            <tr>
                <td>Total</td>
                <td><input type="number" min="0" max="100" name="Total" readonly></td>
            </tr>
            <tr>
                <td>Percentage</td>
                <td><input type="number" min="0" max="100" name="per" readonly></td>
            </tr>
            <tr>
                <td>Grade</td>
                <td><input type="text" name="Grade" readonly></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="button" value="Calculate" onclick="Calculate()"></td>
            </tr>
        </table> 
    </form>
</body>
<script>
    
    function Calculate()
    {
        var s1,s2,s3,s4,s5,total,per;
        s1=parseInt(document.frm1.sub1.value);
        s2=parseInt(document.frm1.sub2.value);
        s3=parseInt(document.frm1.sub3.value);
        s4=parseInt(document.frm1.sub4.value);
        s5=parseInt(document.frm1.sub5.value);
        total=s1+s2+s3+s4+s5;
        per=total*100/500;
        document.frm1.total.value=total;
        document.frm1.per.value=per;
        if(per>=90)
     {
        document.frm1.grade.value="A+";
     }
    else if(per>=80)
     {
        document.frm1.grade.value="A";
     }
    else if(per>=70)
     {
        document.frm1.grade.value="B";
     }
    else if(per>=60)
     {
        document.frm1.grade.value="C";
     }
    else if(per>=50)
     {
       document.frm1.grade.value="D"; 
     }
    else
     {
        document.frm1.grade.value="fail";
     }

    }

</script>
</html>
