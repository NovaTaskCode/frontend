<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays parctise</title>
</head>
<body>
    <h1>parctise javascript formula</h1>
</body>

      <script>

        let emptyArr = [];
        let arr = [1,2,3];

        document.write(arr)
        document.write("<br>")
        document.write()

        let arr2 = new Array(1,2,3,4,5);
        let arr3 = new Array(20);

        document.write(arr2);
        document.write("<br>")

        document.write(arr3);

        let matrix = [[1,2],[3,4]];
        let matrix3D = [[[1]],[[2]]];
        let matrix2D = new Array([[1,2],[3,4]]);
        
        document.write("<br>")

        document.write(matrix);
        document.write("<br>")

        document.write(matrix3D);
        document.write("<br>")

        document.write(matrix2D);
        
        document.write("<br>")
        document.write("<br>")

        document.write(arr[0]);
        document.write("<br>")

         document.write(matrix[0][1]);
         document.write("<br>")
         
         document.write(arr2[2]);
         document.write("<br>")
         
         arr[0] = 10;
         document.write(arr[0]);
         document.write("<br>")
         
         
         const fruits = ["apple", "banana", "cherry"];
         
         const [firstFruit, secondFruit ,thirdFruit] = fruits;

         document.write(firstFruit);
         document.write("<br>")
         document.write(secondFruit);
         document.write("<br>")
         document.write(thirdFruit);
         document.write("<br>")
         document.write("<br>")
         
         
         const [,,thirdFruits] = fruits;
         document.write(thirdFruit);
         document.write("<br>")
         
         const [ secondFruits] = fruits;
         document.write(secondFruit);
         document.write("<br>")

         const [ firstFruits] = fruits;
         document.write(firstFruit);
         document.write("<br>")
         document.write("<br>")

         const [a, ...restofFruit] = fruits;
         document.write(a);
         document.write("<br>")
         document.write(restofFruit);

         let x = 1;
         let y = 2;
         [x,y] = [y,x];
         
         document.write("<br>")
         document.write(x);
         document.write("<br>")
         document.write(y);
         document.write("<br>")
         document.write(x,y);
         document.write("<br>")
         document.write(y,x); 
         document.write("<br>")
         document.write([x,y]=[y,x]);
         document.write("<br>")
         document.write([y,x]+ [x,y]);
         

         




      </script>

</html>
