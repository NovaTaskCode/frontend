<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check age</title>
</head>
<style>
    body {
        background-color: yellow;
        color: blue;
    }
    h1{
        color: red;
    }
    table {
        border-width: 2px;
        border-color: red;
        border-style: solid;
    }
</style>
<body>
    <h1>Check age program</h1>
    <form name="formcalc" method="post">
        <table>
            <tr>
                <td>Enter a Age:</td>
                <td><input type="text" name="n1" size="10"></td>
            </tr>
            <tr>
                <td>Show age status:</td>
                <td><input type="text" name="result" size="10"></td>
            </tr>
            <tr>
                <td><input type="button" value="check age" onclick="check()"></td>
                <td><input type="reset" value="clear"></td>
            </tr>
        </table>
    </form>
</body>
<script>
    function check()
    {
        var age;

        age= Number(document.formcalc.n1.value);
        if(age>50)

        {
            document.formcalc.result.value="old age";
        }
        else if(age>21)
        {
            document.formcalc.result.value="young age";
        }
        else if(age>0)
        {
            document.formcalc.result.value="tiny age";
        }
        else
        {
            document.formcalc.result.value="invalid";
        }
    }
</script>
</html>
