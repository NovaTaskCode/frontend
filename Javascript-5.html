<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple calculator</title>
</head>
<style>
    body {
        background-color: pink;
        color: blue;
    }
    h1 {
        background-color: yellow;
        color: red;
        font-size: 20pt;
        font-family: arial;
    }
</style>
<body>
    <h1>Show Largest value</h1>
    <form name="formcalc" method="post">
        <table bgcolor="yellow" border="3">
            <tr>
                <td>num1:</td>
                <td><input type="text" name="n1" size="10"></td>
            </tr>
            <tr>
                <td>num2:</td>
                <td><input type="text" name="n2" size="10"></td>
            </tr>
            <tr>
                <td>num3:</td>
                <td><input type="text" name="n3" size="10"></td>
            </tr>
            <tr>
                <td>result:</td>
                <td><input type="text" name="result" size="10"></td>
            </tr>
            <tr>
                <td><input type="button" value="largest" onclick="calculator()"></td>
                <td><input type="reset" value="clear"></td>
            </tr>
        </table>
    </form>
</body>
<script>
    function calculator()
    {
        var num1,num2,num3,largest;
        num1= Number(document.formcalc.n1.value);
        num2= Number(document.formcalc.n2.value);
        num3= Number(document.formcalc.n3.value);
        if(num1> num2 && num1> num3)
    {
        document.formcalc.result.value=num1;
    }
    else if(num2> num1 && num2> num3)
    {
        document.formcalc.result.value=num2;
    }
    else if(num3>  num1 && num3> num2)
    {
        document.formcalc.result.value=num3;
    }
    else
    {
        document.formcalc.result.value="both equal";
    }
    }
</script>
</html>
